<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STEVE 1.0 — Live</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#111827;color:#f3f4f6}body{margin:0 auto;max-width:1050px;padding:18px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:1.4rem}p,small{color:#b8c4d5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}.card{padding:16px;background:#1f2937;border-radius:12px;border-left:5px solid #64748b}.fresh{border-left-color:#38bdf8}.stale{border-left-color:#ef4444}.bpm{font-size:2rem;font-weight:bold}.notice{padding:12px;border:1px solid #64748b;border-radius:8px;margin:12px 0}button,input{padding:11px;border-radius:8px;background:#334155;color:white;border:1px solid #64748b}input{min-width:220px}form{display:flex;gap:8px;flex-wrap:wrap}
</style></head><body>
<header><h1>STEVE 1.0 — Live</h1><strong id="connection">ยังไม่เชื่อมต่อ</strong></header>
<div class="notice">PROTOTYPE — ข้อมูลชีพจรไม่ใช่เครื่องมือวินิจฉัยหรือรับรองความปลอดภัยระหว่างฝึก สัญญาณขาด = ไม่ทราบค่า ห้ามตีความว่าเป็น 0 BPM</div>
<form id="login"><input id="token" type="password" autocomplete="off" placeholder="รหัสเข้าถึง Dashboard" required><button>เข้าสู่ระบบ</button></form>
<div id="controls" hidden><button id="logout">ออกจากระบบ</button><button id="refresh">โหลดข้อมูลล่าสุด</button></div>
<div id="demo" class="notice" hidden>
 <strong>DEMO / SIMULATED DATA ONLY — ไม่ใช่ชีพจรของทหารจริง</strong>
 <p id="demoState">พร้อมทดสอบระบบ</p>
 <button id="demoStart">เริ่มจำลอง 15 นาย</button>
 <button id="demoDrop">จำลองสัญญาณ R03 ขาด</button>
 <button id="demoDropGateway">ตัด Gateway G03</button>
 <button id="demoRestore">คืนสัญญาณ R03</button>
 <button id="demoStop">หยุดจำลอง</button>
</div>
<p id="gateways" aria-live="polite">Gateway: ยังไม่มีข้อมูล</p><p id="conditions" role="status">WBGT: ยังไม่มีข้อมูล</p><form id="wbgtForm" hidden><label for="wbgt">กรอก WBGT จากเครื่องวัด (°C)</label><input id="wbgt" type="number" min="0" max="60" step="0.1" placeholder="WBGT °C" required><button>บันทึกค่าที่วัด</button></form><p id="summary" role="status">รอการเข้าสู่ระบบ</p><div id="cards" class="grid"></div>
<script>
"use strict";
let events=null,last=null,transportUp=false;const cards=document.getElementById("cards"),summary=document.getElementById("summary"),conn=document.getElementById("connection");
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function draw(data){if(!data||!Array.isArray(data.recruits))return;last=data;
 const now=Date.now();let fresh=0;
 cards.innerHTML=data.recruits.map(r=>{
  const age=Number.isFinite(r.timestamp)?Math.max(0,now-r.timestamp):Infinity;
  const stale=!transportUp||r.stale||age>15000||!Number.isInteger(r.hr);
  const state=!transportUp?"DISCONNECTED":!r.timestamp?"NO DATA":r.state==="DISCONNECTED"?"DISCONNECTED":stale?"STALE":"CONNECTED";
  const synthetic=r.source==='SIMULATED';
  if(!stale)fresh++;
  return '<article class="card '+(stale?'stale':'fresh')+'"><strong>'+escapeHtml(r.id)+'</strong><div class="bpm">'+(stale?'—':r.hr)+' <small>'+(stale?state:'BPM')+'</small></div><small>'+(stale?'ไม่มีข้อมูลปัจจุบัน':Math.round(age/1000)+' วินาทีที่แล้ว')+'</small><div><small>Gateway: '+escapeHtml(r.gateway||'—')+(synthetic?' • SIMULATED':' • LIVE')+"</small></div><div><small>Last: "+(r.timestamp?escapeHtml(new Date(r.timestamp).toLocaleTimeString('th-TH')):'—')+'</small></div></article>';
 }).join("");
 summary.textContent='มีข้อมูลปัจจุบัน '+fresh+'/15 • ข้อมูลขาด '+(15-fresh)+'/15 • '+new Date().toLocaleTimeString("th-TH");
}
async function gatewayStatus(){try{const r=await fetch('/api/gateways',{credentials:'same-origin',cache:'no-store'});if(!r.ok)return;const d=await r.json();document.getElementById('gateways').textContent='Gateway: '+d.gateways.map(g=>g.id+' '+(g.online?'ออนไลน์':'ออฟไลน์')).join(' • ');}catch{document.getElementById('gateways').textContent='Gateway: ตรวจสอบสถานะไม่ได้';}}
async function demoStatus(){
 try{
  const r=await fetch('/api/demo',{credentials:'same-origin',cache:'no-store'});
  const d=document.getElementById('demo');
  if(!r.ok){d.hidden=true;return;}
  const status=await r.json();
  d.hidden=false;
  document.getElementById('demoState').textContent=status.active?'กำลังส่งข้อมูลจำลอง • '+(status.droppedG03?'G03 ขาดสัญญาณ':status.droppedR03?'R03 ขาดสัญญาณ':'ครบ 15 นาย'):'หยุดจำลองแล้ว / ยังไม่เริ่ม';
 }catch{document.getElementById('demo').hidden=true;}
}
async function demoAction(action) {
 try{
  const r=await fetch('/api/demo',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});
  if(!r.ok)throw Error('HTTP '+r.status);
  await demoStatus();await snapshot();
 }catch{document.getElementById('demoState').textContent='ส่งคำสั่ง DEMO ไม่สำเร็จ';}
}
document.getElementById('demoStart').onclick=()=>demoAction('start');
document.getElementById('demoDropGateway').onclick=()=>demoAction('drop-gateway');
document.getElementById('demoDrop').onclick=()=>demoAction('drop');
document.getElementById('demoRestore').onclick=()=>demoAction('restore');
document.getElementById('demoStop').onclick=()=>demoAction('stop');
async function contextStatus(){try{const r=await fetch("/api/context",{credentials:"same-origin",cache:"no-store"});if(!r.ok)return;const d=await r.json();document.getElementById("conditions").textContent=d.timestamp?(d.stale?"WBGT: ค่าเก่ากว่า 30 นาที ต้องวัดใหม่":"WBGT (กรอกมือ): "+d.wbgtC+" °C • "+new Date(d.timestamp).toLocaleTimeString("th-TH")):"WBGT: ยังไม่มีข้อมูลการวัด";}catch{document.getElementById("conditions").textContent="WBGT: ตรวจข้อมูลไม่ได้";}}
async function snapshot(){try{const r=await fetch('/api/snapshot',{credentials:'same-origin',cache:'no-store'});if(r.status===401){disconnect();return;}if(!r.ok)throw Error('HTTP '+r.status);transportUp=true;draw(await r.json());await gatewayStatus();await contextStatus();}catch(e){transportUp=false;if(last)draw(last);conn.textContent='DISCONNECTED — โหลดข้อมูลไม่สำเร็จ';}}
function disconnect(){last=null;transportUp=false;if(events){events.close();events=null;}conn.textContent='ไม่ได้เชื่อมต่อ';document.getElementById('login').hidden=false;document.getElementById('controls').hidden=true;document.getElementById('wbgtForm').hidden=true;document.getElementById('demo').hidden=true;cards.innerHTML='';summary.textContent='กรุณาเข้าสู่ระบบ';}
function connect(){if(events)events.close();document.getElementById('login').hidden=true;document.getElementById('controls').hidden=false;document.getElementById('wbgtForm').hidden=false;demoStatus();events=new EventSource('/api/events');
 events.onopen=()=>{transportUp=true;conn.textContent='เชื่อมต่อข้อมูลสดแล้ว';};events.onerror=()=>{transportUp=false;if(last)draw(last);conn.textContent='สัญญาณขาด / กำลังเชื่อมใหม่';snapshot();};
 events.onmessage=e=>{try{transportUp=true;draw(JSON.parse(e.data))}catch{}};
 snapshot();
}
document.getElementById('login').onsubmit=async e=>{e.preventDefault();const token=document.getElementById('token').value;const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});document.getElementById('token').value='';if(r.ok)connect();else summary.textContent='รหัสไม่ถูกต้อง';};
document.getElementById('wbgtForm').onsubmit=async e=>{e.preventDefault();const wbgtC=Number(document.getElementById('wbgt').value);try{const r=await fetch('/api/context',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({wbgtC})});if(!r.ok)throw Error('HTTP '+r.status);document.getElementById('wbgt').value='';await contextStatus();}catch{document.getElementById('conditions').textContent='WBGT: บันทึกไม่สำเร็จ';}};
document.getElementById('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});disconnect();};
document.getElementById('refresh').onclick=snapshot;
setInterval(()=>{if(last)draw(last);},1000);
setInterval(()=>{if(last){gatewayStatus();contextStatus();demoStatus();}},5000);
snapshot().then(()=>{if(last)connect();});
</script></body></html>
