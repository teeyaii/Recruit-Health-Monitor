name: STEVE iOS simulator build (unsigned)
on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-compile.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-compile.yml'
  workflow_dispatch:
jobs:
  compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test synthetic BLE packet decoding
        run: |
          swiftc ios/HeartRatePacket.swift ios/AssignmentRules.swift ios/tests/main.swift -o /tmp/steve-packet-tests
          /tmp/steve-packet-tests
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iOS simulator project
        working-directory: ios
        run: xcodegen generate
      - name: Compile unsigned iOS simulator app
        run: xcodebuild -project ios/STEVEGateway.xcodeproj -scheme STEVEGateway -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build

