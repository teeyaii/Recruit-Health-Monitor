name: STEVE 1.0 backend tests
on:
  push:
    paths:
      - 'server/**'
      - 'dashboard/live.html'
      - 'README.md'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test backend
        working-directory: server
        run: npm test
