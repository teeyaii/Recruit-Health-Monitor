name: STEVE 1.0 backend tests
on:
  push:
    paths:
      - 'server/**'
      - 'dashboard/live.html'
      - 'dashboard/index.html'
      - 'README.md'
      - 'render.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'dashboard/live.html'
      - 'dashboard/index.html'
      - 'README.md'
      - 'render.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test backend
        working-directory: server
        run: npm test
      - name: Simulate 5 gateways and 15 recruits
        env:
          RECRUIT_MONITOR_TOKEN: ci-only-long-random-placeholder-token-12345
          STEVE_SYNTHETIC_MODE: '1'
          PORT: '18080'
          MONITOR_URL: http://127.0.0.1:18080
        run: |
          node server/index.js &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then break; fi
            sleep 1
          done
          node server/simulate-five-gateways.js


  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build LIVE backend Docker image
        run: docker build --tag steve-live-smoke .
      - name: Verify production container health and private API
        run: |
          docker run --rm --detach --name steve-live-smoke -p 127.0.0.1:18082:8080 \
            -e NODE_ENV=production -e COOKIE_SECURE=1 -e PORT=8080 \
            -e STEVE_VIEWER_TOKEN=ci-viewer-long-enough-for-render-style-example-123 \
            -e STEVE_GATEWAY_TOKEN_G01=ci-g01-long-enough-for-render-style-example-123 \
            -e 'STEVE_SLOT_MAP_JSON={"G01":{"R01":"demo-opaque-001"}}' \
            steve-live-smoke
          trap 'docker stop steve-live-smoke >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18082/health | grep -q '"ok":true'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          status=$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:18082/api/snapshot)
          test "$status" = 401
