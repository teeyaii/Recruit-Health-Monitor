name: STEVE Android compile (no BLE device)
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-compile.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-compile.yml'
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile unsigned Android debug APK
        run: gradle -p android :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: steve-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

